name: Build all targets

# Builds the native worker for every declared target in one run.
#
# PLATFORMS in src/execution/runtime.ts, after the local linux-arm64 patch, is:
#   win32-x64, linux-x64, linux-arm64, darwin-arm64, darwin-x64
#
# Linux targets use musl, matching upstream v0.5.2's release matrix; the aarch64
# leg cross-compiles with cargo-zigbuild because the hosted x64 runner has no
# aarch64 linker. This is the verification workflow; release.yml owns publishing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/execution/runtime.ts'
      - '.github/workflows/build-all-targets.yml'

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest,   target: win32-x64,   triple: x86_64-pc-windows-msvc }
          - { runner: ubuntu-24.04,    target: linux-x64,    triple: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04,    target: linux-arm64,  triple: aarch64-unknown-linux-musl, zigbuild: true }
          - { runner: macos-latest,    target: darwin-arm64, triple: aarch64-apple-darwin }
          - { runner: macos-15-intel,  target: darwin-x64,   triple: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        if: matrix.zigbuild
        with:
          python-version: '3.12'

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add "${{ matrix.triple }}"
          rustc -Vv

      - name: Install zig (aarch64 Linux only)
        if: matrix.zigbuild
        run: |
          python -m pip install --disable-pip-version-check 'ziglang==0.13.0' 'cargo-zigbuild==0.19.7'
          python -m ziglang version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Build the plugin JS
        run: npm run build

      - name: Build the native worker
        shell: bash
        run: |
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --locked --manifest-path native/Cargo.toml --target ${{ matrix.triple }}
          else
            cargo build --release --locked --manifest-path native/Cargo.toml --target ${{ matrix.triple }}
          fi

      - name: Stage and verify the runtime
        shell: bash
        run: |
          node bin/native-runtime.mjs stage --platform ${{ matrix.target }} --input native/target/${{ matrix.triple }}/release
          node bin/native-runtime.mjs check --platform ${{ matrix.target }}

      - name: Record the digest
        shell: bash
        run: |
          worker=$(ls runtime/${{ matrix.target }}/dsh-ops-worker*)
          {
            echo "### ${{ matrix.target }}"
            echo '```'
            echo "triple:  ${{ matrix.triple }}"
            echo "rustc:   $(rustc -V)"
            if command -v sha256sum >/dev/null; then
              echo "size:    $(wc -c < "$worker") bytes"
              echo "sha256:  $(sha256sum "$worker" | cut -d' ' -f1)"
            else
              echo "size:    $(stat -f %z "$worker") bytes"
              echo "sha256:  $(shasum -a 256 "$worker" | cut -d' ' -f1)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: runtime/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
